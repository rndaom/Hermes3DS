name: 3ds-platform
label: Nintendo 3DS
kind: platform
version: 0.2.0
requires_hermes: ">=0.22.5"
description: >
  Nintendo 3DS gateway adapter for Hermes Agent. Opens an encrypted TCP listener
  (Noise IK) that the Hermes 3DS homebrew app connects to: streaming chat, tool
  progress, approvals, clarify, sessions, models, skills, cron, and a chat with
  each Hermes profile (bots).
author: Random
optional_env:
  - name: THREEDS_PORT
    description: "TCP port the 3DS connects to (default 7333)"
    prompt: "3DS listener port"
    password: false
  - name: THREEDS_HOME_CHANNEL
    description: "Chat id (dev:<fingerprint>) for cron delivery; see `hermes 3ds devices`"
    prompt: "3DS home chat id"
    password: false
  - name: THREEDS_AWAY
    description: "Away-from-home access through a Tailscale Funnel: on, auto or off (default off; or run `hermes 3ds away on`)"
    prompt: "3DS away-from-home access (on/auto/off)"
    password: false
  - name: THREEDS_AWAY_PORT
    description: "Loopback port the Tailscale Funnel forwards to (default 7339)"
    prompt: "3DS away listener port"
    password: false
